<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page_title or title }}</title>
    <link rel="icon" type="image/png" href="{{ panel_logo_path }}?v={{ asset_version | default('1') }}" />
    <link rel="stylesheet" href="/static/app.css?v={{ asset_version | default('1') }}" />
    {% block head_extra %}{% endblock %}
    {% block script_extra %}{% endblock %}
    <script defer src="/static/app.js?v={{ asset_version | default('1') }}"></script>
  </head>
  <body data-page="{{ active_page or 'page' }}">
    <div class="app-shell">
      <aside class="sidebar" aria-label="主导航">
        <a class="brand" href="/" aria-label="{{ panel_title_cn }}">
          <span class="brand-mark brand-mark--image">
            <img src="{{ panel_logo_path }}?v={{ asset_version | default('1') }}" alt="{{ panel_title_cn }} Logo" />
          </span>
          <span class="brand-copy">
            <strong>{{ panel_title_cn }}</strong>
            <small>{{ panel_title_en }}</small>
          </span>
        </a>
        <nav class="nav-stack">
          <section class="nav-group">
            <div class="nav-label">资产分类</div>
            <a class="nav-item{% if active_page == 'overview' %} is-active{% endif %}" href="/">
              <span>总览</span>
            </a>
            {% for category in nav_categories %}
            <a class="nav-item{% if active_page == category.id %} is-active{% endif %}" href="{{ request.url_for('category_page', category_id=category.id) }}">
              <span>{{ category.label }}</span>
            </a>
            {% endfor %}
          </section>
          <section class="nav-group">
            <div class="nav-label">控制中心</div>
            {% for page in fixed_pages %}
            <a class="nav-item{% if active_page == page.id %} is-active{% endif %}" href="{{ request.url_for(page.route_name) }}">
              <span>{{ page.label }}</span>
            </a>
            {% endfor %}
          </section>
        </nav>
      </aside>
      <main class="main-shell">
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
