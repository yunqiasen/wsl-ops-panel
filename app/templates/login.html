<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page_title or panel_title_cn or '登录' }}</title>
    <link rel="icon" type="image/png" href="{{ panel_logo_path }}?v={{ asset_version | default('1') }}" />
    <link rel="stylesheet" href="/static/app.css?v={{ asset_version | default('1') }}" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <form class="login-card" method="post" action="/auth/login">
        <div class="brand login-brand" aria-label="{{ panel_title_cn }}">
          <span class="brand-mark brand-mark--image">
            <img src="{{ panel_logo_path }}?v={{ asset_version | default('1') }}" alt="{{ panel_title_cn }} Logo" />
          </span>
          <span class="brand-copy">
            <strong>{{ panel_title_cn }}</strong>
            <small>{{ panel_title_en }}</small>
          </span>
        </div>
        <div>
          <h1>登录控制台</h1>
          <p>进入本机 WSL 运维面板。</p>
        </div>
        <label>账号<input name="username" autocomplete="username" /></label>
        <label>密码<input name="password" type="password" autocomplete="current-password" /></label>
        <button class="primary-button" type="submit">登录</button>
      </form>
    </main>
  </body>
</html>
